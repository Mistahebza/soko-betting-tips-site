<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Football Predictions</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; color: #222; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 600px; text-align: center; }
        h1 { color: #b00020; }
        p { color: #444; }
        .muted { font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Uh-oh — something went wrong</h1>
        <p>{{ message }}</p>
        <p class="muted">Make sure your <code>API_FOOTBALL_KEY</code> environment variable is set and valid, and try again.</p>
    </div>
</body>
</html>
